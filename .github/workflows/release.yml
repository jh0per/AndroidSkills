name: Release

# Two ways to cut a release:
#   1. Push a version tag (git tag v0.3.0 && git push origin v0.3.0). The plugin manifests must
#      already carry that version; the run fails before publishing if they do not.
#   2. Run this workflow by hand with a tag name. It writes the version into both manifests,
#      commits and tags main, then publishes. That push uses GITHUB_TOKEN, so it does not
#      trigger a second run through the tag trigger.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ inputs.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag format
        run: |
          case "$TAG_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag must look like v1.2.3 (got '$TAG_NAME')"; exit 1 ;;
          esac

      - name: Validate skills
        run: python3 scripts/validate_skills.py

      - name: Check manifest versions match tag
        if: github.event_name == 'push'
        run: |
          VERSION="${TAG_NAME#v}" python3 - <<'PY'
          import json, os, pathlib, sys
          want = os.environ["VERSION"]
          bad = []
          for name in (".claude-plugin/plugin.json", ".codex-plugin/plugin.json"):
              got = json.loads(pathlib.Path(name).read_text()).get("version")
              if got != want:
                  bad.append(f"{name} has version {got!r}, tag wants {want!r}")
          if bad:
              for line in bad:
                  print(f"::error::{line}")
              print("Bump both manifests and re-tag, or use Actions > Release > Run workflow.")
              sys.exit(1)
          PY

      - name: Set plugin version, commit and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "::error::tag $TAG_NAME already exists"; exit 1
          fi
          VERSION="${TAG_NAME#v}" python3 - <<'PY'
          import json, os, pathlib
          for name in (".claude-plugin/plugin.json", ".codex-plugin/plugin.json"):
              p = pathlib.Path(name)
              data = json.loads(p.read_text())
              data["version"] = os.environ["VERSION"]
              p.write_text(json.dumps(data, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json .codex-plugin/plugin.json
          git commit -m "Release $TAG_NAME" || echo "version already set"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin main "$TAG_NAME"

      - name: Build archive and release notes
        run: |
          git archive --format=zip --output=android-kmp-skills.zip "$TAG_NAME" \
            skills .claude-plugin .codex-plugin .agents README.md CONTRIBUTING.md LICENSE
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "$TAG_NAME^" 2>/dev/null || true)
          {
            echo "## Skills ($(ls -d skills/*/ | wc -l))"
            echo
            if [ -n "$PREV" ]; then
              echo "### Skills changed since $PREV"
              CHANGED=$(git diff --name-only "$PREV" "$TAG_NAME" -- skills | cut -d/ -f2 | sort -u)
              if [ -n "$CHANGED" ]; then echo "$CHANGED" | sed 's/^/- /'; else echo "- none"; fi
            else
              ls -d skills/*/ | xargs -n1 basename | sed 's/^/- /'
            fi
            echo
            echo "Install: \`/plugin marketplace add jh0per/AndroidSkills\` then \`/plugin install android-kmp-skills@android-kmp-skills\`."
            echo
          } > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" android-kmp-skills.zip \
            --verify-tag \
            --title "$TAG_NAME" \
            --notes-file notes.md \
            --generate-notes
