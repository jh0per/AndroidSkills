name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills
        run: python3 scripts/validate_skills.py

      - name: Set plugin version from tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          case "$TAG_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag must look like v1.2.3"; exit 1 ;;
          esac
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "tag $TAG_NAME already exists"; exit 1
          fi
          VERSION="${TAG_NAME#v}" python3 - <<'PY'
          import json, os, pathlib
          for name in (".claude-plugin/plugin.json", ".codex-plugin/plugin.json"):
              p = pathlib.Path(name)
              data = json.loads(p.read_text())
              data["version"] = os.environ["VERSION"]
              p.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Commit version bump and tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json .codex-plugin/plugin.json
          git commit -m "Release $TAG_NAME" || echo "version already set"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin main "$TAG_NAME"

      - name: Build archive and release notes
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          git archive --format=zip --output=android-kmp-skills.zip HEAD skills .claude-plugin .codex-plugin .agents README.md CONTRIBUTING.md LICENSE
          PREV=$(git describe --tags --abbrev=0 "$TAG_NAME^" 2>/dev/null || true)
          {
            echo "## Skills ($(ls -d skills/*/ | wc -l))"
            echo
            if [ -n "$PREV" ]; then
              echo "### Changed since $PREV"
              git diff --name-only "$PREV" "$TAG_NAME" -- skills | cut -d/ -f2 | sort -u | sed 's/^/- /'
            else
              ls -d skills/*/ | xargs -n1 basename | sed 's/^/- /'
            fi
            echo
            echo "Install: \`/plugin marketplace add jh0per/AndroidSkills\` then \`/plugin install android-kmp-skills@android-kmp-skills\`."
          } > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" android-kmp-skills.zip \
            --title "$TAG_NAME" \
            --notes-file notes.md
